<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lantern Hollow · Audio Lab</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='4' width='18' height='4' rx='2' fill='%236b4a32'/%3E%3Cpath d='M8 8h16l-2 18H10z' fill='%23f0a64a'/%3E%3Cellipse cx='16' cy='17' rx='4' ry='6' fill='%23fff3c9'/%3E%3Crect x='8' y='26' width='16' height='4' rx='2' fill='%236b4a32'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #22160f;
        --bg2: #2d1e15;
        --panel: #3a281c;
        --panel-hi: #4a3424;
        --line: #5c4330;
        --cream: #f4e7cf;
        --muted: #c6ae8c;
        --amber: #f0a64a;
        --amber-deep: #d9822b;
        --pumpkin: #e8713a;
        --moss: #9bb86a;
        --plum: #b58bd6;
        --danger: #e46a5a;
        --radius: 16px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(1200px 600px at 15% -10%, rgba(240, 166, 74, 0.13), transparent 60%),
          radial-gradient(900px 500px at 110% 10%, rgba(181, 139, 214, 0.08), transparent 60%),
          linear-gradient(180deg, var(--bg2), var(--bg) 40%);
        color: var(--cream);
        font-family: 'Fredoka', ui-rounded, 'Segoe UI', system-ui, sans-serif;
        font-size: 15px;
      }
      body {
        padding: 28px clamp(14px, 3vw, 40px) 60px;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 18px 28px;
        margin-bottom: 22px;
      }
      h1 {
        margin: 0;
        font-weight: 600;
        font-size: clamp(26px, 3.2vw, 38px);
        letter-spacing: 0.3px;
        color: var(--cream);
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35), 0 0 24px rgba(240, 166, 74, 0.25);
      }
      h1 small {
        display: block;
        font-size: 15px;
        font-weight: 400;
        color: var(--muted);
        letter-spacing: 0.2px;
        text-shadow: none;
        margin-top: 2px;
      }
      .lantern {
        width: 46px;
        height: 58px;
        flex: none;
        filter: drop-shadow(0 0 14px rgba(240, 166, 74, 0.55));
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      #status {
        margin-left: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
      }
      .chip b {
        color: var(--cream);
        font-weight: 500;
      }
      .chip.ok b {
        color: var(--moss);
      }
      .chip.warn b {
        color: var(--amber);
      }

      button {
        font: inherit;
        color: var(--cream);
        background: linear-gradient(180deg, var(--panel-hi), var(--panel));
        border: 1px solid var(--line);
        border-bottom-width: 3px;
        border-radius: 12px;
        padding: 8px 14px;
        cursor: pointer;
        transition: transform 0.06s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        user-select: none;
      }
      button:hover {
        border-color: var(--amber-deep);
        box-shadow: 0 0 0 3px rgba(240, 166, 74, 0.12);
      }
      button:active,
      button.flash {
        transform: translateY(2px);
        border-bottom-width: 1px;
        margin-bottom: 2px;
        background: linear-gradient(180deg, #5e4128, #4a3424);
      }
      button.primary {
        background: linear-gradient(180deg, var(--amber), var(--amber-deep));
        color: #2a1708;
        border-color: #a95f1c;
        font-weight: 600;
      }
      button.on {
        background: linear-gradient(180deg, #7d9a52, #5e7a3a);
        border-color: #44592a;
        color: #fbf6e8;
      }
      button.boss.on {
        background: linear-gradient(180deg, #b0503a, #8a3626);
        border-color: #5e2216;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #unlock {
        font-size: 18px;
        padding: 14px 26px;
        border-radius: 16px;
        animation: glow 2.4s ease-in-out infinite;
      }
      #unlock.done {
        animation: none;
      }
      @keyframes glow {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(240, 166, 74, 0.45);
        }
        50% {
          box-shadow: 0 0 0 12px rgba(240, 166, 74, 0);
        }
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
        gap: 16px;
        align-items: start;
      }
      .panel {
        background: linear-gradient(180deg, rgba(74, 52, 36, 0.55), rgba(45, 30, 21, 0.75));
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px 18px 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 235, 200, 0.06);
      }
      .panel.wide {
        grid-column: 1 / -1;
      }
      .panel h2 {
        margin: 0 0 12px;
        font-size: 17px;
        font-weight: 600;
        color: var(--amber);
        letter-spacing: 0.3px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .panel h2 .hint {
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
        margin-left: auto;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 8px 0;
        flex-wrap: wrap;
      }
      .slider {
        display: grid;
        grid-template-columns: 96px 1fr 44px;
        align-items: center;
        gap: 10px;
        margin: 10px 0;
      }
      .slider label {
        color: var(--muted);
        font-size: 14px;
      }
      .slider output {
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-size: 13px;
      }
      input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--amber-deep) var(--fill, 50%), rgba(0, 0, 0, 0.35) var(--fill, 50%));
        outline: none;
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--cream);
        border: 3px solid var(--amber-deep);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        cursor: pointer;
      }
      input[type='range']::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--cream);
        border: 3px solid var(--amber-deep);
        cursor: pointer;
      }
      .sky {
        height: 10px;
        border-radius: 999px;
        margin: -4px 0 6px 106px;
        width: calc(100% - 160px);
        background: linear-gradient(90deg, #f6c66b, #e98a4a 45%, #6b4a7a 70%, #1d2244);
        opacity: 0.55;
      }
      .sfx-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .sfx {
        display: flex;
        gap: 6px;
        align-items: stretch;
      }
      .sfx button.play {
        flex: 1;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: 8px 12px;
      }
      .sfx button.play code {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 13px;
        color: var(--cream);
      }
      .sfx button.play span {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.25;
      }
      .sfx button.spam {
        flex: none;
        width: 58px;
        font-size: 13px;
        color: var(--amber);
        padding: 4px;
      }
      .now {
        background: rgba(0, 0, 0, 0.25);
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 13px;
        color: var(--muted);
        line-height: 1.55;
        min-height: 44px;
      }
      .now b {
        color: var(--cream);
        font-weight: 500;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        text-align: left;
        padding: 5px 8px;
        border-bottom: 1px solid rgba(92, 67, 48, 0.6);
      }
      th {
        color: var(--muted);
        font-weight: 500;
      }
      td.bad {
        color: var(--danger);
        font-weight: 600;
      }
      td.ok {
        color: var(--moss);
      }
      .meter {
        height: 8px;
        background: rgba(0, 0, 0, 0.35);
        border-radius: 999px;
        overflow: hidden;
        min-width: 80px;
      }
      .meter i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--moss), var(--amber) 80%, var(--danger));
        border-radius: 999px;
      }
      .note {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        margin: 6px 0 0;
      }
      #levels-out {
        margin-top: 10px;
        max-height: 520px;
        overflow: auto;
      }
      footer {
        margin-top: 26px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <svg class="lantern" viewBox="0 0 46 58" aria-hidden="true">
          <path d="M16 6h14M23 2v4" stroke="#c6ae8c" stroke-width="3" stroke-linecap="round" fill="none" />
          <rect x="9" y="9" width="28" height="7" rx="3" fill="#6b4a32" />
          <path d="M11 16h24l-3 30H14z" fill="#f0a64a" opacity="0.9" />
          <path d="M17 18v26M23 18v27M29 18v26" stroke="#8a5a2c" stroke-width="2" opacity="0.6" />
          <ellipse cx="23" cy="31" rx="6" ry="9" fill="#fff3c9" opacity="0.85" />
          <rect x="11" y="46" width="24" height="7" rx="3" fill="#6b4a32" />
        </svg>
        <h1>
          Lantern Hollow · Audio Lab
          <small>Procedural sound &amp; music, rendered live with Web Audio</small>
        </h1>
      </div>
      <button id="unlock" class="primary">Unlock audio</button>
      <div id="status"></div>
    </header>
    <main id="app" class="grid"></main>
    <footer>Everything you hear is synthesized in the browser: no sample files.</footer>
    <script type="module" src="/src/audio-lab.ts"></script>
  </body>
</html>
