# Netlify: build the Vite app and serve dist/ (game at /, sound lab at /audio-lab.html)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+
  NODE_VERSION = "22"

# Vite's hashed bundles never change, so cache them forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# painted art isn't hashed: cache for a day, then revalidate
[[headers]]
  for = "/art/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
